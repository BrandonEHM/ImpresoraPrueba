<!--<h2 class="text-center mx-auto p-4 text-blond">Formulario para Ticket</h2> en modo oscuro dark:text-pink-500-->
<div class="text-center mx-auto p-4 text-2xl font-bold text-black  ">Nuevo producto</div>
<form id="Nuevo_Producto">
    <div class="space-y-6 max-w-md mx-auto mt-10">

        <div class="form-group flex items-center gap-x-4 mb-4">
            <label class="block text-lg text-gray-700 after:ml-0.5 after:text-red-500 after:content-['*']">
                Producto</label>
            <input type="text" id="nuevo_Prod" name="nuevo_Prod"
                class="pl-8 w-full border border-gray-300 rounded-lg py-2 px-3 text-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Nombre del producto" />

        </div>


        <div class="form-group flex items-center gap-x-4 mb-4">
            <label class="block text-lg text-gray-700 after:ml-0.5 after:text-red-500 after:content-['*']">
                Precio
            </label>
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-500 text-lg">$</span>
                <input type="number" id="precio" name="precio" min="0" max="99999"
                    oninput="if(this.value.length > 5) this.value = this.value.slice(0,5)"
                    class="pl-8 w-full border border-gray-300 rounded-lg py-2 px-3 text-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="0.00" />
            </div>
        </div>


        <div class="form-group flex items-center gap-x-4 mb-4">
            <label class="block text-lg text-gray-700 after:ml-0.5 after:text-red-500 after:content-['*']">
                Descuento
            </label>
            <div class="relative flex-1">
                <input type="number" id="descuento_precio" name="descuento_precio" min="0" max="100"
                    oninput="if(this.value > 100) this.value = 100; if(this.value.length > 3) this.value = this.value.slice(0,3)"
                    class="pr-8 w-full border border-gray-300 rounded-lg py-2 px-3 text-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="0" />
                <span class="absolute inset-y-0 right-3 flex items-center text-gray-500 text-lg">%</span>
            </div>
        </div>

    </div>

    <div class="flex justify-end max-w-md mx-auto mt-12">
        <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg shadow transition"
            data-modal-target="popup-modal" data-modal-toggle="popup-modal" type="button">
            Agregar
        </button>
    </div>

    <div id="popup-modal" tabindex="-1"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <button type="button"
                    class="absolute top-3 end-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                    data-modal-hide="popup-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
                <div class="p-4 md:p-5 text-center">
                    <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <h3 class="mb-5 text-lg font-normal text-gray-500 dark:text-gray-400">
                        Quieres agregar el producto?
                    </h3>
                    <button data-modal-hide="popup-modal" type="button"
                        class="text-[#E7D3D3] bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 
                        dark:focus:ring-red-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center"
                        onclick="const NombreProducto = document.getElementById('nuevo_Prod'); NombreProducto.value = '';
                        const precio = document.getElementById('precio'); precio.value = '';
                        const descuento_precio= document.getElementById('descuento_precio'); descuento_precio.value = '';">
                        Cancelar, eliminar
                    </button>
                    <button data-modal-hide="popup-modal" type="button"
                        class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border 
                        border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-green-100 dark:focus:ring-green-700 
                        dark:bg-green-600 dark:text-white dark:border-green-700 dark:hover:text-white dark:hover:bg-green-800" 
                        onclick="const NombreProducto = document.getElementById('nuevo_Prod'); NombreProducto.value = '';
                        const precio = document.getElementById('precio'); precio.value = '';
                        const descuento_precio= document.getElementById('descuento_precio'); descuento_precio.value = '';">
                        Si, estoy seguro</button>
                </div>
            </div>
        </div>
    </div>

</form>
