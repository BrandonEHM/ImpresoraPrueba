<div class="mb-4 flex items-center justify-end">
  <app-servicios-create (agreeToCreate)="createServicio($event)" />
</div>

<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">ID</th>
        <th scope="col" class="px-6 py-3">Servicio</th>
        <th scope="col" class="px-6 py-3">Precio</th>
        <th scope="col" class="px-6 py-3">Descuento</th>
        <th scope="col" class="px-6 py-3">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (servicio of servicios(); track servicio.id) {
      <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
          {{servicio.id}}
        </th>
        <td class="px-6 py-4">{{servicio.nombre}}</td>
        <td class="px-6 py-4">{{servicio.precio}}</td>
        <td class="px-6 py-4">{{servicio.descuento}}</td>
        <td class="px-6 py-4 flex gap-2">
          <app-servicios-edit [servicio]="servicio" (agreeToUpdate)="updateServicio($event)" />
          <app-servicios-delete [servicio]="servicio" (agreeToDelete)="deleteServicio(servicio.id)" />
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>

<div class="mt-4 flex justify-center items-center">
  <app-paginacion [TotalResultado]="servicios().length" [Solo10]="10" [PagActual]="1"></app-paginacion>
</div>
