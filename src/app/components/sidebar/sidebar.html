<button 
  (click)="toggleSidebar()"
  type="button" 
  class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
  aria-controls="default-sidebar"
  [attr.aria-expanded]="isSidebarOpen()">
   <span class="sr-only">Open sidebar</span>
   <svg class="w-6 h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
   <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
   </svg>
</button>

<!-- Overlay para cerrar el sidebar al hacer clic fuera -->
@if (isSidebarOpen()) {
  <div 
    (click)="closeSidebar()"
    class="fixed inset-0 z-30 bg-gray-900/50 dark:bg-gray-900/80 md:hidden"
    aria-hidden="true">
  </div>
}

<aside id="default-sidebar" aria-label="Sidebar" [class]="'fixed top-0 left-0 z-40 w-64 h-screen transition-transform ' + (isSidebarOpen() ? 'translate-x-0' : '-translate-x-full') + ' md:translate-x-0'" >
