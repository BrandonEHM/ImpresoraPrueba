<div>
    <div class="flex justify-end">
        <div class="flex items-center justify-between border-t border-white/10 px-4 py-3 sm:px-6">
            <div class="flex flex-1 justify-between sm:hidden">
                <a href="#"
                    class="relative inline-flex items-center rounded-md border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-gray-200 hover:bg-white/10">Previous</a>
                <a href="#"
                    class="relative ml-3 inline-flex items-center rounded-md border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-gray-200 hover:bg-white/10">Next</a>
            </div>
            <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between gap-x-4">
                <div>
                    <p class="text-sm text-gray-500 dark:text-gray-300">
                        Showing
                        <span class="font-medium">{{ PrimerR }}</span>
                        to
                        <span class="font-medium">{{ LimA10 }}</span>
                        of
                        <span class="font-medium">{{ TotalResultado }}</span>
                        results
                    </p>
                </div>
                <div>
                    <nav aria-label="Pagination" class="isolate inline-flex -space-x-px rounded-md">
                        <a href="#" class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-500 inset-ring 
                            inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white/5 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Previous</span>
                            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
                                class="size-5">
                                <path
                                    d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
                                    clip-rule="evenodd" fill-rule="evenodd" />
                            </svg>
                        </a>

                        @for (pagina of paginas; track pagina) {
                        <a href="#" [class.bg-indigo-500]="pagina === PagActual"
                            [class.text-white]="pagina === PagActual" [class.text-gray-400]="pagina !== PagActual"
                            class="relative inline-flex items-center px-4 py-2 text-sm font-semibold inset-ring inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white/5 focus:z-20 focus:outline-offset-0">
                            {{ pagina }}
                        </a>
                        }

                        <a href="#"
                            class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 inset-ring inset-ring-gray-700 dark:inset-ring-gray-400 hover:bg-white/5 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Next</span>
                            <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
                                class="size-5">
                                <path
                                    d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
                                    clip-rule="evenodd" fill-rule="evenodd" />
                            </svg>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
