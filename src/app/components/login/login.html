<!-- Pantalla principal -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-blue-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
      Sistema de Boletaje - Museo
    </h2>

    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          placeholder="Tu usuario"
          class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Tu contraseña"
          class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Iniciar sesión
      </button>

      <!-- Botón que abre el modal -->
      <button
        type="button"
        data-modal-target="registerModal"
        data-modal-toggle="registerModal"
        class="w-full bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-200 transition"
      >
        Crear cuenta
      </button>
    </form>

    <p *ngIf="message" class="mt-4 text-center text-sm text-gray-700">
      {{ message }}
    </p>
  </div>
</div>

<!-- Modal con Flowbite + componente separado -->
<div
  id="registerModal"
  tabindex="-1"
  aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
>
  <div class="relative p-4 w-full max-w-md max-h-full">
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
      <!-- Botón para cerrar -->
      <button
        type="button"
        class="absolute top-3 right-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center"
        data-modal-hide="registerModal"
      >
        ✕
      </button>

      <!-- Aquí se inyecta tu componente de registro -->
      <app-register></app-register>
    </div>
  </div>
</div>
