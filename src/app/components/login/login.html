<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-white to-blue-50">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Sistema de Boletaje - Museos IZC
        </h2>

        <form (ngSubmit)="login()" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre de usuario
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username"
                    [(ngModel)]="username"
                    required 
                    placeholder="Ingresa tu nombre de usuario"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" 
                    />
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    Contraseña
                </label>
                <input 
                    type="password" 
                    id="password"  
                    name="password"
                    [(ngModel)]="password" 
                    required 
                    placeholder="Ingresa tu contraseña"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" 
                    />
            </div>

            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition-colors duration-200"
                >
                Iniciar Sesión
            </button>

            <button
                type="button"
                (click)="register()"
                class="w-full bg-gray-100 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-200 transition-colors duration-200"
            >
                Registrarse
            </button>
        </form>
        
        <p
            *ngIf="message"
            class="mt-4 text-center text-sm"
            [ngClass]="{
                'text-green-600': message.includes('✅'),
                'text-red-600': message.includes('❌'),
                'text-gray-600': message.includes('📝')
            }">
            {{ message }}
        </p>
    </div>
</div>
