<div class="mb-4 flex items-center justify-end">
  <app-boletos-create (agreeToCreate)="createBoletos($event)" />
</div>

<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
  <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4">
    <h2 class="text-2xl font-semibold text-gray-900 dark:text-white flex justify-center">Boletos</h2>
  </div>
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">
          ID
        </th>
        <th scope="col" class="px-6 py-3">
          Boleto
        </th>
        <th scope="col" class="px-6 py-3">
          $ Precio
        </th>
        <th scope="col" class="px-6 py-3">
          Descuento %
        </th>
        <th scope="col" class="px-6 py-3">
          Acciones
        </th>
      </tr>
    </thead>
    <tbody>
      @for (boleto of boletos(); track boleto.id) {
      <tr
        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
          {{boleto.id}}
        </th>
        <td class="px-6 py-4 font-semibold text-gray-900 whitespace-nowrap dark:text-white">
          {{boleto.nombre}}
        </td>
        <td class="px-6 py-4 font-normal text-gray-900 whitespace-nowrap dark:text-white">
          ${{boleto.price.toFixed(2)}}
        </td>
        <td class="px-6 py-4 font-normal text-gray-900 whitespace-nowrap dark:text-white">
          {{boleto.discount}}%
        </td>
        <td class="px-6 py-4 font-normal text-gray-900 whitespace-nowrap dark:text-white flex gap-2">
          <app-boletos-edit [boleto]="boleto" (agreeToUpdate)="updateBoleto($event)" />

          <app-boletos-delete [boleto]="boleto" (agreeToDelete)="deleteBoleto(boleto.id)" />
        </td>
      </tr>
      }

    </tbody>
  </table>
</div>

<div class="mt-4 flex justify-center items-center">
  <app-paginacion [TotalResultado]="boletos().length" [Solo10]="10" [PagActual]="1">
  </app-paginacion>
</div>
