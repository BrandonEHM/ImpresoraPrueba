<!-- <div class="bg-gray-50 text-gray-800 font-sans grid  mx-auto my-auto p-10"> -->

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
        <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4">
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-white flex justify-center">Productos</h2>
        </div>
        <div class="relative">
            <div class="pb-2 bg-primary-light dark:bg-gray-900 flex items-center justify-between">
                <div class="pt-2 px-2">
                    <label for="table-search" class="sr-only">Search</label>
                    <div class="relative mt-1">
                        <div
                            class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                            </svg>
                        </div>
                        <input type="text" id="table-search" (input)="actualizarBusqueda($event)" [value]="Busqueda()"
                            class="block pt-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                            placeholder="Search for items">
                    </div>
                </div>

                <!-- //------------------------ Botón de agregar y que dirige al modal -----------------------------// -->
                <div class="px-2">
                    <button (click)="abrirModalAgregar()"
                        class="font-semibold rounded-lg cursor-pointer transition-all bg-green-500 text-white px-6 py-2 rounded-lg 
                        border-green-600 border-b-[4px] hover:brightness-110 hover:-translate-y-[1px] hover:border-b-[6px]
                        active:border-b-[2px] active:brightness-90 active:translate-y-[2px]"
                        type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 inline-block mr-2" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Agregar
                    </button>
                </div>

            </div>
        </div>


        <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
            <thead class="text-xs text-gray-700 uppercase bg-thirdary-light dark:bg-secondary-dark dark:text-gray-400">
                <tr>
                    <th scope="col" class="px-6 py-3">
                        ID
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Nombre del producto
                    </th>
                    <th scope="col" class="px-6 py-3">
                        $ Precio
                    </th>
                    <th scope="col" class="px-6 py-3">
                        Descuento %
                    </th>

                    <th scope="col" class="px-6 py-3">
                        Acción
                    </th>
                </tr>
            </thead>
            <tbody>
                @for (producto of productosFiltrados(); track producto.id) {
                <tr
                    class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600">
                    <td class="w-4 p-4">{{ producto.id }}</td>

                    <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
                        {{ producto.nombre }}
                    </th>

                    <td class="px-6 py-4">
                        ${{ producto.precio.toFixed(2) }}
                    </td>

                    <td class="px-6 py-4">
                        {{ producto.descuento }}%
                    </td>

                    <td class="px-6 py-4 left-0 space-x-2">
                        <!-- Botón Editar -->
                        <button (click)="seleccionarParaEditar(producto)" data-modal-target="edit-modal"
                            data-modal-toggle="edit-modal"
                            class="inline-flex items-center justify-center w-10 h-10 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 
                            focus:ring-blue-300 rounded-full dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-blue-800 transition-colors"
                            type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                            </svg>
                            <span class="sr-only">Editar producto</span>
                        </button>

                        <!-- Botón Eliminar -->
                        <button (click)="seleccionarParaEliminar(producto)" data-modal-target="delete-modal"
                            data-modal-toggle="delete-modal"
                            class="inline-flex items-center justify-center w-10 h-10 text-white bg-red-600 hover:bg-red-700 focus:ring-4 
                        focus:ring-red-300 rounded-full dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-800 transition-colors" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span class="sr-only">Eliminar producto</span>
                        </button>
                    </td>
                </tr>
                }
            </tbody>

        </table>
    </div>

    <!-- //////////////////////////////////////////////////Eliminar nuevo Producto --------------------------------------- -->
    <div id="delete-modal" tabindex="-1"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <button type="button"
                    class="absolute top-3 end-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                    data-modal-hide="delete-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
                <div class="p-4 md:p-5 text-center">
                    <svg class="mx-auto mb-4 text-gray-400 w-12 h-12 dark:text-gray-200" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <h3 class="mb-5 text-lg font-normal text-gray-500 dark:text-gray-400">
                        Quieres eliminar el producto?
                    </h3>
                    <button (click)="cerrarModalConClick('delete-modal')" type="button"
                        class="text-[#E7D3D3] bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 
                    k:focus:ring-red-800 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center">
                        Cancelar
                    </button>
                    <button (click)="eliminarProducto()" type="button"
                        class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border 
                    border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-green-100 dark:focus:ring-green-700 
                    dark:bg-green-600 dark:text-white dark:border-green-700 dark:hover:text-white dark:hover:bg-green-800">
                        Si, estoy seguro
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- ---------------Componente del Modal Agregar Productos----------------------- -->
    <app-modal-agregar-producto #modalAgregar (productoAgregado)="onProductoAgregado($event)">
    </app-modal-agregar-producto>



    <!-- ********************************************Editar Producto --------------------------------------- -->
    <!-- Modal toggle -->
    <!-- Main modal -->
    <div id="edit-modal" tabindex="-1" aria-hidden="true"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div
                    class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                        Editar producto
                    </h3>
                    <button type="button"
                        class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                        data-modal-toggle="edit-modal"
                        onclick="const NombreProducto = document.getElementById('name'); NombreProducto.value = '';
                                const precio = document.getElementById('price'); precio.value = '';
                                const descuento_precio= document.getElementById('discount'); descuento_precio.value = '';">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <form class="p-4 md:p-5" (submit)="guardarCambios($event)">
                    <div class="grid gap-4 mb-4 grid-cols-2">
                        <div class="col-span-2">
                            <label for="edit-name"
                                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nombre</label>
                            <input type="text" name="edit-name" id="edit-name" [(ngModel)]="productoEditado().nombre"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                                placeholder="Nombre del producto" required="">
                        </div>

                        <div class="col-span-2 sm:col-span-1">
                            <label for="edit-price"
                                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Precio</label>
                            <div class="relative">
                                <span
                                    class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-lg">$</span>
                                <input type="number" name="edit-price" id="edit-price"
                                    [(ngModel)]="productoEditado().precio" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                                focus:ring-primary-600 focus:border-primary-600 block w-full pl-8 pr-2.5 py-2.5
                                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white 
                                dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="0.0"
                                    required="" oninput="if(this.value.length > 5) this.value = this.value.slice(0,5)">
                            </div>
                        </div>

                        <div class="col-span-2 sm:col-span-1">
                            <label
                                class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Descuento</label>
                            <div class="relative">
                                <input type="number" name="edit-discount" id="edit-discount"
                                    [(ngModel)]="productoEditado().descuento" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                                focus:ring-primary-600 focus:border-primary-600 block w-full pl-8 pr-2.5 py-2.5
                                dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white 
                                dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="0" required=""
                                    oninput="if(this.value > 100) this.value = 100; if(this.value.length > 3) this.value = this.value.slice(0,3)">
                                <span
                                    class="absolute inset-y-0 right-10 flex items-center pl-3 text-gray-400 text-lg">%</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-center">
                        <button type="submit" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none 
                        focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 
                        dark:focus:ring-blue-800">
                            <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                                xmlns="http://www.w3.org/2000/svg" className="size-5">
                                <path fill-rule="evenodd"
                                    d="m5.433 13.917 1.262-3.155A4 4 0 0 1 7.58 9.42l6.92-6.918a2.121 2.121 0 0 1 3 3l-6.92 6.918c-.383.383-.84.685-1.343.886l-3.154 1.262a.5.5 0 0 1-.65-.65Z"
                                    clip-rule="evenodd">
                                </path>
                                <path
                                    d="M3.5 5.75c0-.69.56-1.25 1.25-1.25H10A.75.75 0 0 0 10 3H4.75A2.75 2.75 0 0 0 2 5.75v9.5A2.75 2.75 0 0 0 4.75 18h9.5A2.75 2.75 0 0 0 17 15.25V10a.75.75 0 0 0-1.5 0v5.25c0 .69-.56 1.25-1.25 1.25h-9.5c-.69 0-1.25-.56-1.25-1.25v-9.5Z" />
                            </svg>
                            Aceptar cambio
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ****************************  Pagination  ****************************  -->
    <!-- ---------------Componente de Paginacion----------------------- -->
     <div class="mt-4 flex justify-center items-center">
         <app-paginacion [TotalResultado]="productosFiltrados().length" [Solo10]="10" [PagActual]="1">
         </app-paginacion>

     </div>


<!-- </div> -->
