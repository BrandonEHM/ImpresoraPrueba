<div class="text-5xl font-bold text-center mt-8">
    <p>Editar Producto</p>
</div>

<div class="flex justify-center mt-12 gap-16">
    <div class="grid justify-items-center">
        <button class="transform transition hover:scale-110 focus:scale-95" (click)="navegarNuevoProducto()">
            <img src="/assets/AgregarProductoIMG.png" alt="Agregar Producto"
                class="w-64 h-64 object-contain mx-auto rounded-xl shadow-md hover:shadow-xl">
        </button>
        <p class="text-base font-bold mt-8">Agregar producto</p>
    </div>

    <div class="grid justify-items-center">
        <button class="transform transition hover:scale-110 focus:scale-95" (click)="navegarEditarProducto()">
            <img src="/assets/EditarProductoIMG.png" alt="Editar Producto"
                class="w-64 h-64 object-contain mx-auto rounded-xl shadow-md hover:shadow-xl" />
        </button>
        <p class="text-base font-bold mt-8">Editar producto</p>
    </div>
</div>
